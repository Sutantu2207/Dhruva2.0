# ==============================================================================
# Dhruva.AI V2 — Fly.io Deployment Blueprint (fly.toml)
# Target: FastAPI 0.115+, Python 3.12, Uvicorn, Persistent SQLite Volume
# ==============================================================================

app = "dhruva-backend"
primary_region = "sin" # Singapore (Lowest latency for India/Asia users)

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  DATABASE_URL = "sqlite+aiosqlite:////data/dhruva_prod.db"
  SECRET_KEY = "dhruva-production-jwt-secret-key-2026-v2-replace-in-fly-secrets"
  JWT_ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "60"
  REFRESH_TOKEN_EXPIRE_DAYS = "14"
  CORS_ORIGINS = "*"

[mounts]
  source = "dhruva_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health/live"

