# ==============================================================================
# Dhruva.AI V2 — Render Production Infrastructure Blueprint (render.yaml)
# Free Tier Optimized | Native Docker Runtime | Managed PostgreSQL 16
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Primary FastAPI Intelligence Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: dhruva-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore # Lowest latency for India / Coimbatore
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SERVICE_NAME
        value: dhruva-backend
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: dhruva-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 14
      - key: REDIS_ENABLED
        value: false
      - key: CORS_ORIGINS
        value: "*"
      - key: ARGON2_TIME_COST
        value: 3
      - key: ARGON2_MEMORY_COST
        value: 65536
      - key: ARGON2_PARALLELISM
        value: 4

# ------------------------------------------------------------------------------
# 2. Managed PostgreSQL 16 Database with Automated Provisioning
# ------------------------------------------------------------------------------
databases:
  - name: dhruva-postgres
    databaseName: dhruva_db
    user: dhruva_admin
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: [] # Private network isolation inside Render cloud
