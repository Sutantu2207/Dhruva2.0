# ==============================================================================
# Dhruva.AI V2 — Render Infrastructure Blueprint (render.yaml)
# Target Deployment: Render (FastAPI Web Service + PostgreSQL 16 + Redis)
# Note: Zero Railway Dependency. Standard vendor-neutral infrastructure manifest.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Primary API Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: dhruva-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: oregon
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SERVICE_NAME
        value: dhruva-backend
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: dhruva-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: REDIS_ENABLED
        value: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: dhruva-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://dhruva.vercel.app,https://*.vercel.app"
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: ARGON2_TIME_COST
        value: 3
      - key: ARGON2_MEMORY_COST
        value: 65536
      - key: ARGON2_PARALLELISM
        value: 4

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Token Bucket Rate Limiter
  # ----------------------------------------------------------------------------
  - type: redis
    name: dhruva-redis
    region: oregon
    plan: starter
    ipAllowList: [] # Strict private network isolation inside Render

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL 16 Database with pgvector
# ------------------------------------------------------------------------------
databases:
  - name: dhruva-postgres
    region: oregon
    databaseName: dhruva_db
    user: dhruva_admin
    plan: standard
    postgresMajorVersion: "16"
    ipAllowList: [] # Private network only; external access through Render dashboard
